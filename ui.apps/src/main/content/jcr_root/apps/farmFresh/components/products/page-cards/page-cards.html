<div data-sly-use.model="com.bhasaka.farmfresh.core.models.PageCardsModel">
    <div class="container mt-4">
        <div class="row">
            <sly data-sly-list.pageCard="${model.pageCards}">
                <div class="col-md-4 mb-4">
                    <div class="card">
                        <img src="${pageCard.imagePath}" class="card-img-top">
                        <div class="card-body">
                            <h5 class="card-title">${pageCard.title}</h5>
                            <p class="card-text">${pageCard.description}</p>
                        </div>
                    </div>
                </div>
            </sly>
        </div>
    </div>
</div>
